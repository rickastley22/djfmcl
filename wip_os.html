<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WIP // MP3 PLAYER</title>
  <!-- Metadata Extractor CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --dim: #555555;
      --border: 2px solid #ffffff;
    }

    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      overflow: hidden;
    }

    body {
      color: var(--fg);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Metalcore CRT Screen Container */
    .ipod-body {
      width: 92%;
      max-width: 360px;
      max-height: calc(100dvh - 20px);
      background: #080808;
      border: 4px solid #ffffff;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
      position: relative;
      z-index: 10;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: auto;
    }

    /* Subtle iPod Watermark Logo in Bottom Right Corner */
    .ipod-body::after {
      content: "";
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 65px;
      height: 65px;
      background-image: url('media/fmcl_logo%20white.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.25;
      pointer-events: none;
      z-index: 1;
    }

    /* Scanline overlay effect */
    .ipod-body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      border-radius: 16px;
    }

    /* Display Window */
    .screen {
      background: rgba(0, 0, 0, 0.95);
      border: var(--border);
      height: 230px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }

    /* Matrix Rain Canvas */
    #matrix-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.25;
      z-index: 1;
      pointer-events: none;
    }

    .header-bar {
      border-bottom: 1px dashed var(--fg);
      padding-bottom: 4px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      position: relative;
      z-index: 2;
    }

    .content-area {
      display: flex;
      gap: 10px;
      height: 125px;
      margin-top: 5px;
      position: relative;
      z-index: 2;
    }

    /* Track List */
    .view-list {
      flex: 1;
      overflow-y: auto;
      font-size: 10px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .view-list li {
      padding: 4px 2px;
      border-bottom: 1px dotted #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: rgba(0, 0, 0, 0.6);
    }

    .view-list li.selected {
      background: var(--fg);
      color: var(--bg);
      font-weight: bold;
    }

    /* Album Art Frame */
    .album-art-box {
      width: 90px;
      height: 90px;
      border: var(--border);
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      text-align: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .album-art-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(160%);
    }

    /* Metadata Panel */
    .metadata-panel {
      font-size: 10px;
      line-height: 1.3;
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.85);
      border-top: 1px dashed #444;
      padding-top: 4px;
    }

    .metadata-panel .title {
      font-weight: bold;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Middle Control Bar for Bass Boost & Nightcore Switches */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      padding-left: 2px;
      padding-right: 2px;
      z-index: 5;
    }

    .toggle-btn {
      background: #111;
      border: 1px solid var(--fg);
      color: var(--fg);
      font-family: inherit;
      font-size: 9px;
      font-weight: bold;
      padding: 3px 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      border-radius: 4px;
    }

    .toggle-btn.active {
      background: var(--fg);
      color: var(--bg);
    }

    /* Click Wheel */
    .wheel-container {
      margin: 10px auto 5px auto;
      width: 210px;
      height: 210px;
      max-width: 60vw;
      max-height: 60vw;
      border: 3px solid var(--fg);
      border-radius: 50%;
      position: relative;
      background: #050505;
      touch-action: none;
      cursor: grab;
      z-index: 2;
      flex-shrink: 0;
    }

    .wheel-container:active {
      cursor: grabbing;
    }

    .wheel-btn {
      position: absolute;
      font-size: 10px;
      font-weight: bold;
      color: var(--fg);
      background: none;
      border: none;
      cursor: pointer;
      z-index: 5;
    }

    .btn-menu { top: 10px; left: 50%; transform: translateX(-50%); }
    .btn-prev { left: 10px; top: 50%; transform: translateY(-50%); }
    .btn-next { right: 10px; top: 50%; transform: translateY(-50%); }
    .btn-play { bottom: 10px; left: 50%; transform: translateX(-50%); }

    .center-button {
      position: absolute;
      width: 30%;
      height: 30%;
      background: var(--fg);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 6;
    }
    .center-button:active { background: var(--dim); }

    .status-text { font-size: 9px; color: var(--dim); margin-top: 2px; }

    /* Extra safety for short screens */
    @media (max-height: 600px) {
      .screen { height: 180px; }
      .content-area { height: 95px; }
      .album-art-box { width: 70px; height: 70px; }
      .wheel-container { width: 170px; height: 170px; margin: 5px auto 0 auto; }
    }
  </style>
</head>
<body>

<div class="ipod-body">
  <div class="screen">
    <canvas id="matrix-canvas"></canvas>

    <div class="header-bar">
      <span>WIP_OS v1.0</span>
      <span id="system-time">00:00</span>
    </div>

    <div class="content-area" id="screen-content">
      <ul class="view-list" id="file-tree"></ul>
      <div class="album-art-box">
        <img id="album-art" src="media/fmcl_logo%20white.png" alt="ARTWORK">
      </div>
    </div>

    <div class="metadata-panel">
      <div class="title" id="track-title">--</div>
      <div id="track-artist">--</div>
      <div id="track-details" class="status-text">--</div>
    </div>
  </div>

  <div class="controls-bar">
    <button class="toggle-btn" id="bassboost-btn" onclick="toggleBassBoost()">
      BASSBOOST: <span id="bb-status">OFF</span>
    </button>
    <button class="toggle-btn" id="nightcore-btn" onclick="toggleNightcore()">
      NIGHTCORE: <span id="nc-status">OFF</span>
    </button>
  </div>

  <div class="wheel-container" id="click-wheel">
    <button class="wheel-btn btn-menu" onclick="navigateUp()">MENU</button>
    <button class="wheel-btn btn-prev" onclick="prevTrack()">&lt;&lt;</button>
    <button class="wheel-btn btn-next" onclick="nextTrack()">&gt;&gt;</button>
    <button class="wheel-btn btn-play" onclick="togglePlay()">PLAY/PAUSE</button>
    <div class="center-button" onclick="selectCurrentItem()"></div>
  </div>
</div>

<audio id="audio-player" crossorigin="anonymous"></audio>

<script>
  const PUBLIC_DRIVE_LINK = "https://drive.google.com/drive/folders/1a8Z6mxESX7ynvjqUEeKjTpb3zN5czw-v?usp=sharing";
  const DRIVE_API_KEY = "AIzaSyBQCo54xkbkHqFwqGHnGFzgSSWAC22S_9c";
  const DEFAULT_PLACEHOLDER_ART = "media/fmcl_logo%20white.png";

  function extractFolderId(link) {
    const match = link.match(/\/folders\/([a-zA-Z0-9_-]+)/);
    return match ? match[1] : link;
  }

  const rootFolderId = extractFolderId(PUBLIC_DRIVE_LINK);
  let currentItems = [];
  let selectedIndex = 0;
  let folderHistory = [];
  let isNightcore = false;
  let isBassBoost = false;
  const audio = document.getElementById('audio-player');

  // Web Audio Context DSP Setup
  let dspContext = null;
  let audioSourceNode = null;
  let bassFilterNode = null;
  let distortionNode = null;
  let gainNode = null;

  function initAudioDSP() {
    if (dspContext) return;

    dspContext = new (window.AudioContext || window.webkitAudioContext)();
    audioSourceNode = dspContext.createMediaElementSource(audio);

    // Low-shelf filter for bass boost
    bassFilterNode = dspContext.createBiquadFilter();
    bassFilterNode.type = 'lowshelf';
    bassFilterNode.frequency.setValueAtTime(180, dspContext.currentTime);

    // Hard clipping WaveShaper node
    distortionNode = dspContext.createWaveShaper();
    distortionNode.curve = createHardClippingCurve(400);
    distortionNode.oversample = '4x';

    // Output Gain
    gainNode = dspContext.createGain();

    // Default bypass routing
    audioSourceNode.connect(dspContext.destination);
  }

  function createHardClippingCurve(amount) {
    const k = typeof amount === 'number' ? amount : 50;
    const n_samples = 44100;
    const curve = new Float32Array(n_samples);
    const deg = Math.PI / 180;

    for (let i = 0; i < n_samples; ++i) {
      let x = (i * 2) / n_samples - 1;
      curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  function applyDSP() {
    if (!dspContext) initAudioDSP();
    if (dspContext.state === 'suspended') dspContext.resume();

    audioSourceNode.disconnect();
    bassFilterNode.disconnect();
    distortionNode.disconnect();
    gainNode.disconnect();

    if (isBassBoost) {
      bassFilterNode.gain.setValueAtTime(24, dspContext.currentTime);
      audioSourceNode.connect(bassFilterNode);
      bassFilterNode.connect(distortionNode);
      distortionNode.connect(gainNode);
      gainNode.connect(dspContext.destination);
    } else {
      audioSourceNode.connect(dspContext.destination);
    }
  }

  function toggleBassBoost() {
    triggerClickSound();
    isBassBoost = !isBassBoost;

    const btn = document.getElementById('bassboost-btn');
    const statusText = document.getElementById('bb-status');

    if (isBassBoost) {
      btn.classList.add('active');
      statusText.innerText = "ON";
    } else {
      btn.classList.remove('active');
      statusText.innerText = "OFF";
    }

    applyDSP();
  }

  function applyNightcoreSettings() {
    audio.preservesPitch = !isNightcore;
    audio.webkitPreservesPitch = !isNightcore;
    audio.mozPreservesPitch = !isNightcore;
    audio.playbackRate = isNightcore ? 1.35 : 1.0;
  }

  function toggleNightcore() {
    triggerClickSound();
    isNightcore = !isNightcore;
    
    const btn = document.getElementById('nightcore-btn');
    const statusText = document.getElementById('nc-status');
    
    if (isNightcore) {
      btn.classList.add('active');
      statusText.innerText = "1.35x";
    } else {
      btn.classList.remove('active');
      statusText.innerText = "OFF";
    }

    applyNightcoreSettings();
  }

  audio.addEventListener('play', () => {
    applyNightcoreSettings();
    applyDSP();
  });

  function fetchDriveFolder(folderId = rootFolderId) {
    const query = `'${folderId}' in parents and trashed = false`;
    const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType)&key=${DRIVE_API_KEY}`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        if (data.files && data.files.length > 0) {
          currentItems = data.files;
          selectedIndex = 0;
          renderList();
        } else if (data.error) {
          console.error("Drive Error:", data.error);
          renderStatusMessage(data.error.message ? data.error.message.toUpperCase() : "FETCH ERROR");
        } else {
          currentItems = [];
          renderStatusMessage("NO FILES FOUND");
        }
      })
      .catch(err => {
        console.error("Drive Error:", err);
        renderStatusMessage("FETCH ERROR");
      });
  }

  function renderStatusMessage(msg) {
    const tree = document.getElementById('file-tree');
    tree.innerHTML = `<li>[ ${msg} ]</li>`;
  }

  // Matrix Rain Background Engine
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  resizeCanvas();

  const chars = '01';
  const fontSize = 10;
  let columns = Math.floor(canvas.width / fontSize);
  let drops = Array(columns).fill(1);

  function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = chars.charAt(Math.floor(Math.random() * chars.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(drawMatrix, 50);

  window.addEventListener('resize', () => {
    resizeCanvas();
    columns = Math.floor(canvas.width / fontSize);
    drops = Array(columns).fill(1);
  });

  // Synthesizer Click Sound
  let audioCtx = null;

  function triggerClickSound() {
    if (navigator.vibrate) navigator.vibrate(8);

    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.015);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.015);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.015);
    } catch (e) {}
  }

  // Click Wheel Interaction Controls
  const wheel = document.getElementById('click-wheel');
  let isDragging = false;
  let previousAngle = null;
  let accumulatedAngle = 0;
  const ANGLE_THRESHOLD = 18;

  function getAngle(x, y) {
    const rect = wheel.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    return Math.atan2(y - centerY, x - centerX) * (180 / Math.PI);
  }

  function handleStart(e) {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const rect = wheel.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const dist = Math.hypot(clientX - centerX, clientY - centerY);

    if (dist < 35) return;

    isDragging = true;
    previousAngle = getAngle(clientX, clientY);
    accumulatedAngle = 0;
  }

  function handleMove(e) {
    if (!isDragging || currentItems.length === 0) return;

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const currentAngle = getAngle(clientX, clientY);

    let delta = currentAngle - previousAngle;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    accumulatedAngle += delta;
    previousAngle = currentAngle;

    if (Math.abs(accumulatedAngle) >= ANGLE_THRESHOLD) {
      const steps = Math.floor(Math.abs(accumulatedAngle) / ANGLE_THRESHOLD);
      const direction = accumulatedAngle > 0 ? 1 : -1;

      for (let i = 0; i < steps; i++) {
        selectedIndex = (selectedIndex + direction + currentItems.length) % currentItems.length;
        triggerClickSound();
      }

      accumulatedAngle %= ANGLE_THRESHOLD;
      renderList();
    }
  }

  function handleEnd() {
    isDragging = false;
    previousAngle = null;
  }

  wheel.addEventListener('mousedown', handleStart);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);

  wheel.addEventListener('touchstart', handleStart, { passive: true });
  window.addEventListener('touchmove', handleMove, { passive: true });
  window.addEventListener('touchend', handleEnd);

  // Clock
  setInterval(() => {
    const d = new Date();
    document.getElementById('system-time').innerText = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
  }, 1000);

  function renderList() {
    const tree = document.getElementById('file-tree');
    tree.innerHTML = '';

    currentItems.forEach((item, index) => {
      const li = document.createElement('li');
      const isFolder = item.mimeType === 'application/vnd.google-apps.folder';
      li.innerText = (isFolder ? 'DIR> ' : 'TRK> ') + item.name;
      if (index === selectedIndex) li.className = 'selected';
      tree.appendChild(li);
    });

    const selectedEl = tree.children[selectedIndex];
    if (selectedEl) selectedEl.scrollIntoView({ block: 'nearest' });
  }

  function playTrack(item) {
    const streamUrl = `https://www.googleapis.com/drive/v3/files/${item.id}?alt=media&key=${DRIVE_API_KEY}`;
    audio.src = streamUrl;
    applyNightcoreSettings();
    applyDSP();
    audio.play();

    // Direct fallback labels
    document.getElementById('track-title').innerText = item.name.toUpperCase();
    document.getElementById('track-artist').innerText = "STREAMING...";
    document.getElementById('track-details').innerText = "AUDIO FILE";
    document.getElementById('album-art').src = DEFAULT_PLACEHOLDER_ART;

    // Fetch file as Blob to bypass jsmediatags XHR CORS range restrictions
    fetch(streamUrl)
      .then(res => res.blob())
      .then(blob => {
        jsmediatags.read(blob, {
          onSuccess: function(tag) {
            const tags = tag.tags;
            if (tags.title) document.getElementById('track-title').innerText = tags.title.toUpperCase();
            if (tags.artist) document.getElementById('track-artist').innerText = "ARTIST: " + tags.artist.toUpperCase();
            document.getElementById('track-details').innerText = `${tags.album || 'SINGLE'} [${tags.year || 'N/A'}]`;

            if (tags.picture) {
              let base64String = "";
              for (let i = 0; i < tags.picture.data.length; i++) {
                base64String += String.fromCharCode(tags.picture.data[i]);
              }
              document.getElementById('album-art').src = `data:${tags.picture.format};base64,${window.btoa(base64String)}`;
            }
          },
          onError: function(err) {
            document.getElementById('track-artist').innerText = "NO ID3 TAGS";
          }
        });
      })
      .catch(() => {
        document.getElementById('track-artist').innerText = "STREAMING ONLY";
      });
  }

  function selectCurrentItem() {
    triggerClickSound();
    if (!currentItems[selectedIndex]) return;
    const item = currentItems[selectedIndex];

    if (item.mimeType === 'application/vnd.google-apps.folder') {
      folderHistory.push(item.id);
      fetchDriveFolder(item.id);
    } else {
      playTrack(item);
    }
  }

  function togglePlay() {
    triggerClickSound();
    if (audio.src === "" && currentItems.length > 0) {
      playTrack(currentItems[0]);
    } else if (audio.paused) {
      applyNightcoreSettings();
      applyDSP();
      audio.play();
    } else {
      audio.pause();
    }
  }

  function prevTrack() {
    triggerClickSound();
    if (currentItems.length === 0) return;
    selectedIndex = (selectedIndex - 1 + currentItems.length) % currentItems.length;
    renderList();
  }

  function nextTrack() {
    triggerClickSound();
    if (currentItems.length === 0) return;
    selectedIndex = (selectedIndex + 1) % currentItems.length;
    renderList();
  }

  function navigateUp() {
    triggerClickSound();
    if (folderHistory.length > 0) {
      folderHistory.pop();
      const parentId = folderHistory.length > 0 ? folderHistory[folderHistory.length - 1] : rootFolderId;
      fetchDriveFolder(parentId);
    }
  }

  fetchDriveFolder();
</script>
</body>
</html>
